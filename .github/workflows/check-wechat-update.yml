name: 检查微信更新并自动提取 Hook 配置

on:
  # 定时检查：每天 UTC 2:00（北京时间 10:00）
  schedule:
    - cron: '0 2 * * *'
  # 也支持手动触发
  workflow_dispatch:
    inputs:
      run_extract:
        description: '是否执行提取工作流（默认提取，可手动关闭）'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  actions: write

jobs:
  check-and-extract:
    name: 检查更新并自动提取
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 抓取微信更新页面并提取 APK 链接
        id: scrape
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/wxscrape
          MOBILE_UA="Mozilla/5.0 (Linux; Android 8.0.0; SM-G955U Build/R16NW) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Mobile Safari/537.36"

          fetch_page() {
            local url="$1" out="$2" ua="$3"
            echo "  抓取: $url"
            curl -sL --max-time 15 --retry 2 --retry-delay 5 \
              -A "$ua" -o "$out" "$url" && [ -s "$out" ]
          }

          # ============================================================
          # 步骤 1：移动端 UA 访问 Android 更新列表页
          # ============================================================
          echo "===== 步骤1：获取 Android 更新列表页 ====="
          LIST_FILE="/tmp/wxscrape/list.html"
          if ! fetch_page "https://weixin.qq.com/updates?platform=android" "$LIST_FILE" "$MOBILE_UA"; then
            echo "::warning::无法获取列表页"
            echo "apk_url=" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "  列表页获取成功 ($(wc -c < "$LIST_FILE") 字节)"

          # ============================================================
          # 步骤 2：Python 解析 → 提取最新版本号 → 访问详情页 → 找 APK
          # ============================================================
          python3 << 'PYEOF'
          import os, re, html, subprocess, sys

          MOBILE_UA = "Mozilla/5.0 (Linux; Android 8.0.0; SM-G955U Build/R16NW) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Mobile Safari/537.36"

          def fetch(url, ua=MOBILE_UA):
              """curl 抓取页面"""
              result = subprocess.run(
                  ["curl", "-sL", "--max-time", "15", "--retry", "2", "--retry-delay", "5",
                   "-A", ua, url],
                  capture_output=True, text=True, timeout=20
              )
              return result.stdout if result.returncode == 0 and result.stdout.strip() else ""

          def extract_section(text, section_id):
              """提取 id='section_id' 的 DOM 节点内容"""
              # 匹配 <... id="android" ...> ... </...> 或自闭合之前的内容
              pattern = re.compile(
                  r'<[^>]+\bid\s*=\s*["\']' + re.escape(section_id) + r'["\'][^>]*>(.*?)(?=<[^>]+\bid\s*=\s*["\']|$)',
                  re.I | re.DOTALL
              )
              m = pattern.search(text)
              return m.group(1) if m else text

          def parse_version(text):
              """从文本提取微信版本号 X.X.X (主版本 >= 8)"""
              for m in re.finditer(r'(\d+)\.(\d+)\.(\d+)', text):
                  if int(m.group(1)) >= 8:
                      return m.group(0)
              return ""

          def version_short(ver):
              """8.0.76 → 8076"""
              return ver.replace(".", "")

          def find_apk(text):
              """在页面中搜索 APK 下载链接"""
              # 策略1：下载最新版本
              m = re.search(r'<a[^>]*href=["\'](https?://[^"\'>]+?\.apk)["\'][^>]*>\s*下载最新版本\s*</a>', text, re.I)
              if m:
                  return m.group(1), "下载最新版本"

              # 策略2：下载最新版本 反向查找
              m = re.search(r'<a[^>]*>\s*下载最新版本\s*</a>', text, re.I)
              if m:
                  before = text[:m.start()]
                  href_m = re.findall(r'href=["\'](https?://[^"\'>]+?\.apk)["\']', before)
                  if href_m:
                      return href_m[-1], "下载最新版本(反向)"

              # 策略3：所有 .apk 链接，优先 arm64
              apk_urls = re.findall(r'https?://[^"\'> ]+\.apk', text)
              if apk_urls:
                  arm64 = [u for u in apk_urls if "arm64" in u.lower()]
                  return (arm64[0] if arm64 else apk_urls[0]), "APK 链接列表"
              return "", ""

          def find_version_in_section(text, section_id="android"):
              """在指定 DOM 区域内提取版本号"""
              section = extract_section(text, section_id)
              # 发布版本： 微信 8.0.76
              m = re.search(r'发布版本[：:]\s*微信\s*(\d+\.\d+\.\d+)', section)
              if m: return m.group(1)
              # Android 8.0.76 或更新至 X.X.X
              m = re.search(r'(?:Android|更新至)\D*(\d+\.\d+\.\d+)', section)
              if m: return m.group(1)
              # 兜底: 区域内任意 X.X.X (主版本>=8)
              return parse_version(section)

          # ------- 主流程 -------

          # 2a. 读取列表页
          with open("/tmp/wxscrape/list.html", "r", encoding="utf-8", errors="replace") as f:
              list_page = f.read()
          list_page = html.unescape(list_page)

          # 2b. 在 id="android" 区域内提取第一个版本号
          version = find_version_in_section(list_page, "android")
          if version:
              print(f"从列表页 (id=android) 提取到版本: {version}")
          else:
              # 兜底：全页搜索
              version = parse_version(list_page)
              if version:
                  print(f"从列表页（全页兜底）提取到版本: {version}")
              else:
                  print("::warning::未能从列表页提取版本号")

          apk_url = ""
          vshort = version_short(version) if version else ""

          # 2c. 优先访问 SSR 详情页: /updates/android/{vshort}?head=true
          #     （该页面不依赖 Vue.js，curl 即可获取完整内容，包含 APK 链接）
          detail_pages = []
          if vshort:
              detail_pages.append((
                  f"https://weixin.qq.com/updates/android/{vshort}?head=true",
                  f"SSR详情页(android/{vshort})"
              ))
          if version:
              detail_pages.append((
                  f"https://weixin.qq.com/updates?platform=android&version={version}",
                  f"SPA详情页(version={version})"
              ))

          for detail_url, label in detail_pages:
              print(f"\n  尝试 {label}: {detail_url}")
              detail_html = fetch(detail_url)
              if not detail_html:
                  print(f"    页面为空，跳过")
                  continue

              detail_html = html.unescape(detail_html)
              print(f"    获取成功 ({len(detail_html)} 字节)")

              # 详情页 APK 链接在 id="android" 之外，必须搜全页
              apk_url, method = find_apk(detail_html)
              if apk_url:
                  print(f"    ✓ 找到 APK ({method}): {apk_url}")
                  # 详情页可能有更精确的版本号
                  v2 = parse_version(detail_html)
                  if v2 and int(v2.split('.')[0]) >= 8:
                      version = v2
                      print(f"    版本号更新: {version}")
                  break
              else:
                  print(f"    未找到 APK 链接")

          # 2d. 兜底：在列表页全页搜索 APK 链接
          if not apk_url:
              print(f"\n  兜底：在列表页全页搜索 APK 链接...")
              apk_url, method = find_apk(list_page)
              if apk_url:
                  print(f"  ✓ 找到 APK ({method}): {apk_url}")
                  if not version:
                      m = re.search(r'(\d+\.\d+\.\d+)', apk_url)
                      if m: version = m.group(1)
              else:
                  print("::warning::所有途径均未找到 APK 链接")

          # 2e. 最终版本号确认
          if not version and apk_url:
              m = re.search(r'(\d+\.\d+\.\d+)', apk_url)
              if m: version = m.group(1)

          print(f"\n===== 结果 =====")
          print(f"  APK:    {apk_url if apk_url else '未找到'}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"apk_url={apk_url}\n")
          PYEOF

      - name: 检查链接是否与上次提取过的一致
        id: check
        shell: bash
        run: |
          LAST_URL=""
          if [ -f ".last_apk_url" ]; then
            LAST_URL=$(cat .last_apk_url)
            echo "上次已成功提取的链接: $LAST_URL"
          else
            echo "首次运行，无历史记录"
          fi

          CURRENT_URL="${{ steps.scrape.outputs.apk_url }}"
          echo "当前最新链接: $CURRENT_URL"

          if [ -z "$CURRENT_URL" ]; then
            echo "未抓取到 APK 链接，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$LAST_URL" = "$CURRENT_URL" ]; then
            echo "链接与上次提取过的相同，说明无新版本，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到新版本 APK 链接！"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发 Hook 配置提取并等待完成
        if: steps.check.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_extract == true)
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e -o pipefail

          APK_URL="${{ steps.scrape.outputs.apk_url }}"

          echo "========================================"
          echo "  触发 Hook 配置提取"
          echo "  APK: $APK_URL"
          echo "========================================"

          # 触发下游工作流，保存原始输出（不依赖 --json / --jq）
          RUN_OUTPUT=$(gh workflow run "提取微信 Hook 配置" \
            --ref master \
            -f apk_url="$APK_URL" 2>&1)
          echo "gh 输出: $RUN_OUTPUT"

          # 从输出文本中提取 run ID（兼容中英文输出）
          RUN_ID=$(echo "$RUN_OUTPUT" | grep -oP '\d{7,}' | head -1)
          if [ -z "$RUN_ID" ]; then
            echo "::error::无法解析 Run ID，触发可能失败"
            exit 1
          fi

          echo "触发完成，Run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          # 等待下游工作流完成（最多等 30 分钟）
          echo "等待提取工作流完成..."
          set +e
          gh run watch "$RUN_ID" --exit-status --interval 30 2>&1
          WATCH_EXIT=$?
          set -e

          if [ $WATCH_EXIT -eq 0 ]; then
            CONCLUSION="success"
          else
            # 尝试多种方式获取结论（兼容新版旧版 gh）
            CONCLUSION=$(gh run view "$RUN_ID" 2>/dev/null | grep -oiE '(success|failure|cancelled|skipped)' | head -1 || echo "")
            if [ -z "$CONCLUSION" ]; then
              CONCLUSION=$(gh run view "$RUN_ID" --json conclusion 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['conclusion'])" 2>/dev/null || echo "failure")
            fi
            echo "提取工作流未通过，结论: $CONCLUSION"
          fi
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"

      - name: 提取成功后更新链接记录
        if: steps.trigger.outputs.conclusion == 'success'
        shell: bash
        run: |
          CURRENT_URL="${{ steps.scrape.outputs.apk_url }}"

          # 写入记录文件
          echo "$CURRENT_URL" > .last_apk_url

          # 提交到仓库（先拉取远程变更，避免 extract 工作流已推送导致的冲突）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last_apk_url
          git commit -m "chore: update last APK link [skip ci]"
          git pull --rebase --autostash origin master
          git push

          echo "已成功更新 .last_apk_url 记录"

      - name: 提取失败告警
        if: steps.trigger.outputs.conclusion != '' && steps.trigger.outputs.conclusion != 'success'
        shell: bash
        run: |
          echo "::warning::提取工作流未成功完成（结论: ${{ steps.trigger.outputs.conclusion }}）"
          echo "::warning::链接未标记为已处理，下次定时检查将重试"
          echo "::warning::APK 链接: ${{ steps.scrape.outputs.apk_url }}"
