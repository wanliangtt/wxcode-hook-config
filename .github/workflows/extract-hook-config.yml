name: 提取微信 Hook 配置

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '微信版本号（留空则从文件名自动识别）'
        required: false
        type: string
      apk_url:
        description: 'APK 下载直链'
        required: true
        type: string
      fast_mode:
        description: '快速模式（仅反编目标包，30 秒完成）'
        required: false
        default: true
        type: boolean

  # 上传 APK 后自动触发
  workflow_run:
    workflows: ["上传微信 APK"]
    types:
      - completed

permissions:
  contents: write
  actions: write

jobs:
  extract:
    name: 提取 Hook 配置
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖（aapt + Java）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends aapt
        shell: bash

      - name: 设置 Java（jadx 依赖）
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 获取 APK
        id: get_apk
        shell: bash
        run: |
          mkdir -p apk_input

          # ----- 方式1：手动触发，从 URL 下载（保留原始文件名）-----
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cd apk_input
            FILENAME=$(basename "${{ inputs.apk_url }}" | sed 's/?.*//')
            [ -z "$FILENAME" ] && FILENAME="wechat.apk"
            curl -L --retry 3 --retry-delay 10 -o "$FILENAME" "${{ inputs.apk_url }}"
            echo "apk_path=apk_input/$FILENAME" >> $GITHUB_OUTPUT
            echo "下载完成: $FILENAME"

            # 从文件名推断版本号（备用）
            INFERRED=$(echo "$FILENAME" | grep -oP '\d+\.\d+\.\d+' || echo "")
            if [ -n "$INFERRED" ]; then
              echo "inferred_version=$INFERRED" >> $GITHUB_OUTPUT
              echo "文件名识别版本: $INFERRED"
            fi

          # ----- 方式2：上传 APK 后联动触发 -----
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "从 artifacts 获取 APK ..."
            gh run download "${{ github.event.workflow_run.id }}" \
              --name wechat-apk --dir apk_input
            APK_FILE=$(ls apk_input/*.apk 2>/dev/null | head -1)
            if [ -z "$APK_FILE" ]; then
              echo "错误: artifacts 中未找到 APK"
              exit 1
            fi
            echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
            echo "获取完成: $(basename $APK_FILE)"
          fi

      - name: 提取 Hook 配置
        id: extract
        shell: bash
        env:
          JADX_HOME: ${{ github.workspace }}/tools/jadx
        run: |
          APK_PATH="${{ steps.get_apk.outputs.apk_path }}"
          chmod +x scripts/extract_hook_config.py

          # 组装命令
          CMD="python scripts/extract_hook_config.py"
          CMD="$CMD \"$APK_PATH\""

          # 版本号：优先用户输入 > APK 内部识别 > 文件名推断 > unknown
          if [ -n "${{ inputs.version }}" ]; then
            CMD="$CMD \"${{ inputs.version }}\""
          elif [ -n "${{ steps.get_apk.outputs.inferred_version }}" ]; then
            CMD="$CMD \"${{ steps.get_apk.outputs.inferred_version }}\""
          else
            CMD="$CMD --detect-version"
          fi

          CMD="$CMD --ci"
          if [ "${{ inputs.fast_mode }}" != "false" ]; then
            CMD="$CMD --fast"
          fi
          CMD="$CMD --verbose"

          echo "运行: $CMD"
          eval $CMD

      - name: 上传提取结果（artifact 备份）
        uses: actions/upload-artifact@v6
        with:
          name: hook-config
          path: config/hook_config_*.json
          retention-days: 90

      - name: 提交配置到仓库
        id: commit
        shell: bash
        run: |
          set -e

          # 确定版本号
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ steps.get_apk.outputs.inferred_version }}"
          fi

          # 查找生成的配置文件
          CONFIG_FILE=$(ls config/hook_config_*.json 2>/dev/null | head -1)
          if [ -z "$CONFIG_FILE" ]; then
            echo "::warning::未找到生成的配置文件，跳过提交"
            exit 0
          fi

          echo "生成的配置文件: $CONFIG_FILE"

          # 更新 known_configs.json
          if [ -n "$VERSION" ]; then
            echo "更新 known_configs.json（版本 $VERSION）..."
            export CONFIG_FILE
            python3 -c '
          import json, os
          config_file = os.environ["CONFIG_FILE"]
          known_file = "config/known_configs.json"

          # 读取提取到的配置
          with open(config_file, "r", encoding="utf-8") as f:
              new_config = json.load(f)

          # 读取已知配置表
          with open(known_file, "r", encoding="utf-8") as f:
              known = json.load(f)

          # 合并新版本配置
          for ver, cfg in new_config.items():
              if ver not in known.get("versions", {}):
                  known["versions"][ver] = cfg
                  print(f"  已添加 {ver} 到 known_configs.json")

          with open(known_file, "w", encoding="utf-8") as f:
              json.dump(known, f, indent=2, ensure_ascii=False)
              f.write('\n')  # 确保文件末尾有换行符

          print("  known_configs.json 更新完成")
          '
          fi

          # Git 提交
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/hook_config_*.json config/known_configs.json

          if git diff --cached --quiet; then
            echo "没有变更需要提交"
            exit 0
          fi

          COMMIT_MSG="chore: add hook config"
          [ -n "$VERSION" ] && COMMIT_MSG="$COMMIT_MSG for WeChat $VERSION"
          COMMIT_MSG="$COMMIT_MSG [skip ci]"

          git commit -m "$COMMIT_MSG"
          git pull --rebase --autostash origin master
          git push

          echo "已提交配置到仓库"

      - name: 输出配置摘要
        shell: bash
        run: |
          echo ""
          echo "========================================="
          echo "  Hook 配置提取完成"
          echo "========================================="
          ls -la config/hook_config_*.json 2>/dev/null || echo "(config 目录无新文件)"
          echo "========================================="
